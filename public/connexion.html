<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion · To Do It</title>
    <link rel="icon" href="../assets/images/logo_todoit.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=3">
</head>

<body class="auth-page">
    <nav class="public-nav">
        <a class="brand" href="index.html">
            <img class="logo-img" src="../assets/images/logo_todoit.png" alt="">
            <span>To Do It</span>
        </a>
    </nav>

    <main class="auth-main">
        <div class="auth-card">
            <h1>Bon retour</h1>
            <p class="auth-sub">Connectez-vous pour retrouver votre mur.</p>

            <form class="auth-form" action="connexion.php" method="POST">
                <div class="alert alert-error" id="error-message" hidden></div>
                <div class="field">
                    <label for="email">Adresse e-mail</label>
                    <input class="input" type="email" id="email" name="email" placeholder="vous@exemple.fr" autocomplete="email" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input class="input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button class="btn btn-lg btn-block" type="submit">Se connecter</button>
            </form>

            <p class="auth-switch">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
        </div>
    </main>

    <script>
        // Affiche l'erreur transmise par connexion.php (?error=...)
        const error = new URLSearchParams(location.search).get('error');
        if (error) {
            const box = document.getElementById('error-message');
            box.textContent = error;
            box.hidden = false;
        }
    </script>
</body>

</html>
